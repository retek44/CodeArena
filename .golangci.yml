version: "2"

run:
  timeout: 5m
  # Lint the integration tests too.
  build-tags:
    - integration
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    presets:
      # Unchecked fmt.Fprint* and Close on read paths are idiomatic.
      - std-error-handling
    rules:
      # Test fixtures contain fake credentials on purpose.
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
