version: "2"

run:
  timeout: 5m
  # Lint the integration tests too.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    presets:
      # Unchecked fmt.Fprint* and Close on read paths are idiomatic.
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
