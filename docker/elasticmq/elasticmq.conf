# ElasticMQ (SQS-compatible) for local development and the E2E test.
# Mirrors infra/modules/sqs: visibility timeout = worker lease, DLQ after 5 receives.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

queues {
  codearena-submissions-dlq {}

  codearena-submissions {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "codearena-submissions-dlq"
      maxReceiveCount = 5
    }
  }
}
