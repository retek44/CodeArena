# SonarCloud analysis (CI job "SonarCloud"; needs the secret SONAR_TOKEN, see docs/SETUP.md).
# Quality gate: the default "Sonar way" (80 % coverage and no new issues on new code).
sonar.organization=retek44
sonar.projectKey=retek44_CodeArena
sonar.projectName=CodeArena

sonar.sources=backend,frontend/src,runners/core/codearena_runner,lambdas/hint/codearena_hint,lambdas/ws/codearena_ws
sonar.tests=backend,frontend/src,runners/core/tests,lambdas/hint/tests,lambdas/ws/tests
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,frontend/src/api/pact/**,runners/core/tests/**
sonar.exclusions=backend/internal/store/ent/**,backend/internal/store/db/**,frontend/src/api/schema.d.ts,**/testdata/**
# Integration and E2E suites run in other jobs; their packages are test code only.
sonar.coverage.exclusions=backend/cmd/**,backend/e2e/**,backend/internal/store/storetest/**,frontend/src/main.tsx,frontend/src/test/**,frontend/src/api/pact/**
# Generated code and test fixtures are not duplication to fix.
sonar.cpd.exclusions=tests/golden/**,**/*_test.go,**/*.test.tsx

sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.13

sonar.qualitygate.wait=true
