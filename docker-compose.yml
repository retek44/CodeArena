# Local dependencies. Phase 3 adds an AWS emulator (LocalStack or similar) for SQS, S3 and EventBridge.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: codearena
      POSTGRES_PASSWORD: codearena
      POSTGRES_DB: codearena
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the atlas_dev database for migration diffs (runs only on a new volume).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codearena -d codearena"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: backend
    environment:
      PORT: "8080"
      # Apply migrations first: make migrate-apply
      DATABASE_URL: postgres://codearena:codearena@postgres:5432/codearena?sslmode=disable
      # Local only: trusts the X-Dev-User header instead of a Cognito token.
      AUTH_MODE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres-data:
