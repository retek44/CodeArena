name: Destroy preview

# Reusable: destroys the preview environment of one pull request and deletes its
# state file (ADR-0019). Called by preview.yml when the PR closes or loses the
# "preview" label, and by the nightly sweep in destroy.yml. The shared preview
# network (infra/preview/base) stays; it costs nothing.
on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request whose preview to destroy
        type: string
        required: true

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy pr-${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    environment: preview
    # Shared with deploy-environment.yml: never destroy while a deploy runs.
    concurrency:
      group: deploy-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_DIR: infra/preview/pr
      TF_VAR_pr_number: ${{ inputs.pr_number }}
      STATE_KEY: preview/pr-${{ inputs.pr_number }}/terraform.tfstate
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check the input
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "::error::pr_number must be a pull request number"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/codearena-ci-deploy-preview
          aws-region: ${{ vars.AWS_REGION }}
      - name: Is there a preview?
        id: state
        run: |
          if aws s3api head-object --bucket "${TF_STATE_BUCKET}" --key "${STATE_KEY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No state at ${STATE_KEY}: nothing to destroy."
          fi
      - name: terraform destroy
        if: steps.state.outputs.exists == 'true'
        run: |
          terraform -chdir="${TF_DIR}" init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" -backend-config="key=${STATE_KEY}"
          # Lambda functions in a VPC release their network interfaces slowly; destroy may take 20+ minutes.
          terraform -chdir="${TF_DIR}" destroy -input=false -auto-approve -lock-timeout=120s
      # An empty state would make the nightly sweep look at this PR again.
      - name: Delete the state file
        if: steps.state.outputs.exists == 'true'
        run: aws s3api delete-object --bucket "${TF_STATE_BUCKET}" --key "${STATE_KEY}"
