name: Preview

# Preview environment per pull request (ADR-0019), opt-in: add the "preview" label.
# Every push to the labelled PR redeploys it; closing the PR or removing the label
# destroys it, and the nightly sweep in destroy.yml catches anything left over.
# Pull requests from forks get no preview: they have no OIDC token for AWS.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  images:
    if: >-
      vars.AWS_ACCOUNT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action == 'synchronize' || github.event.action == 'reopened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      id-token: write

  deploy:
    needs: images
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: preview
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}

  comment:
    name: Link the preview in the pull request
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
        run: |
          body="Preview of ${GITHUB_SHA::7}: ${SITE_URL}

          Destroyed when this pull request closes or loses the \`preview\` label."
          gh pr comment "${PR_NUMBER}" --edit-last --create-if-none --body "${body}"

  destroy:
    if: >-
      vars.AWS_ACCOUNT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    uses: ./.github/workflows/destroy-preview.yml
    permissions:
      contents: read
      id-token: write
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
