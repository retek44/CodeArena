name: Deploy

# Deploys the selected commit to one environment. Manual on purpose: every running
# environment costs money (RDS, ALB, Fargate), and the nightly destroy workflow
# removes dev and staging again. release.yml promotes through all of them.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      id-token: write

  deploy:
    needs: images
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
