version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directories: ["/backend"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directories: ["/backend", "/runners/python"]
    schedule:
      interval: weekly
    ignore:
      # Python version changes for the runner are deliberate: CI, mypy and ruff target 3.13.
      - dependency-name: "*lambda/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/shared
      - /infra/envs/*
      - /infra/modules/*
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: build
