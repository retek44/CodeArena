version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directories: ["/backend"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directories: ["/backend", "/runners/python", "/runners/cpp"]
    schedule:
      interval: weekly
    ignore:
      # Python version changes for the runner are deliberate: CI, mypy and ruff target 3.13.
      - dependency-name: "*lambda/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the native (Go) compiler without the JS compiler API that
      # openapi-typescript (peer ^5.x) and typescript-eslint (peer <6.1) build on.
      # Revisit when both support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types follow the Node version CI and the image run (24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/shared
      - /infra/envs/*
      - /infra/modules/*
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: build
