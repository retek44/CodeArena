# sqlc: type-safe Go for the hot-path queries (ADR-0004).
# The schema is the Atlas migration directory, so sqlc always sees the real database.
#   docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.31.1 generate
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_interface: true
        emit_result_struct_pointers: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
